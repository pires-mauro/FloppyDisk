[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floppydisk-shared"
version = "1.0.0"
description = "Shared scoring rules and API contracts for bank onboarding"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
packages = ["onboarding_shared"]
