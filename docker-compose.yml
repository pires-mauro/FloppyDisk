services:
  web:
      build:
        context: ./apps/web
        dockerfile: Dockerfile
      container_name: bank-onboarding-web
      ports:
        - "5173:5173"
      env_file:
        - ./apps/web/.env
      environment:
        VITE_API_URL: http://localhost:8000/api
      volumes:
        - ./apps/web:/app
        - /app/node_modules
      depends_on:
        - db
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bank-onboarding-api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: bank-onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_onboarding
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

